name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Run tests
        run: npm test

      - name: Run integration tests
        run: npm run test:integration

  build:
    name: Build · ${{ matrix.os }}
    needs: [lint-and-typecheck, test]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Verify CSS build output
        if: matrix.os == 'ubuntu-latest'
        run: |
          node -e "
            const fs = require('fs'), path = require('path');
            const dir = 'out/renderer/assets';
            const files = fs.readdirSync(dir).filter(f => f.endsWith('.css'));
            if (!files.length) { console.error('No CSS files found in ' + dir); process.exit(1); }
            const css = files.map(f => fs.readFileSync(path.join(dir, f), 'utf-8')).join('');
            const size = Buffer.byteLength(css);
            console.log('CSS output size:', size, 'bytes');
            if (size < 20000) {
              console.error('CSS is too small (' + size + ' bytes) — Tailwind utilities are likely not being generated');
              process.exit(1);
            }
            if (!css.includes('th-surface')) {
              console.error('Custom Tailwind theme colors missing from CSS — tailwind.config.js may not be loaded');
              process.exit(1);
            }
            console.log('CSS output OK');
          "

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-${{ matrix.os }}
          path: out/
          retention-days: 3

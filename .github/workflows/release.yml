# Release
#
# Triggered when a GitHub release is published. Normally that is done by
# release-please (see release-please.yml) when its release PR is merged; a
# release can also still be drafted manually. The release tag (e.g. v0.3.0)
# is used as the app version.

name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  ci:
    name: CI · Lint, Typecheck & Test
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Integration tests
        run: npm run test:integration

  sbom:
    name: SBOM
    needs: [ci]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate CycloneDX SBOM
        shell: bash
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          VERSION="${VERSION#v}"
          mkdir -p dist
          npx @cyclonedx/cyclonedx-npm@6.0.1 \
            --package-lock-only \
            --omit dev \
            --output-reproducible \
            --validate \
            --spec-version 1.6 \
            --output-format JSON \
            --output-file "dist/Postly-${VERSION}-sbom.cdx.json"

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-sbom
          path: dist/*-sbom.cdx.json
          retention-days: 30

      - name: Upload SBOM to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release upload "${{ github.event.release.tag_name }}" dist/*-sbom.cdx.json --clobber

  build:
    needs: [ci]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            label: Windows
          - os: macos-latest
            platform: mac
            label: macOS
          - os: ubuntu-latest
            platform: linux
            label: Linux

    name: Build · ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'

      # Linux arm64 cross-compilation requires additional tools
      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            rpm \
            fakeroot \
            dpkg

      - name: Install dependencies
        run: npm ci

      - name: Build (electron-vite)
        run: npm run build

      - name: Package and publish
        env:
          # electron-builder uses GH_TOKEN to upload assets to the release.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS code signing — base64-encoded .p12 certificate and its password.
          # Set CSC_LINK and CSC_KEY_PASSWORD in GitHub repository secrets.
          # When absent the build proceeds unsigned and the release is not notarized.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          # Prevent electron-builder from searching the system keychain;
          # we supply the cert explicitly via CSC_LINK.
          CSC_IDENTITY_AUTO_DISCOVERY: false
          # macOS notarization is wired conditionally via build/notarize.js.
          # It runs only when APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, and
          # APPLE_TEAM_ID are configured in repository secrets.
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        # Strip the leading 'v' from the tag (v1.2.3 → 1.2.3) and inject it
        # as the app version so package.json never needs to be updated manually.
        shell: bash
        run: |
          # Unset signing vars if the secrets are not configured — an empty
          # string causes electron-builder to resolve it as a path (the cwd).
          [ -z "$CSC_LINK" ] && unset CSC_LINK || true

          VERSION="${{ github.event.release.tag_name }}"
          VERSION="${VERSION#v}"
          npx electron-builder --${{ matrix.platform }} --publish always \
            --config.extraMetadata.version="$VERSION"

      - name: Collect provenance subjects
        id: provenance-subjects
        shell: bash
        run: |
          find dist -maxdepth 1 -type f \
            \( -name '*.AppImage' -o -name '*.blockmap' -o -name '*.deb' -o -name '*.dmg' -o -name '*.exe' -o -name 'latest*.yml' -o -name '*.rpm' -o -name '*.zip' \) \
            | sort > provenance-subjects.txt

          if [ ! -s provenance-subjects.txt ]; then
            echo "No release artifacts found to attest" >&2
            exit 1
          fi

          {
            echo 'paths<<EOF'
            cat provenance-subjects.txt
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Attest packaged artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.provenance-subjects.outputs.paths }}

      - name: Update Homebrew Cask
        if: matrix.platform == 'mac'
        env:
          GH_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          VERSION="${TAG#v}"

          ARM64_SHA=$(shasum -a 256 "dist/Postly-${VERSION}-arm64.dmg" | awk '{print $1}')
          X64_SHA=$(shasum -a 256 "dist/Postly-${VERSION}.dmg" | awk '{print $1}')

          git clone \
            "https://x-access-token:${GH_TOKEN}@github.com/dever-labs/homebrew-tap.git" \
            tap
          cd tap
          mkdir -p Casks

          python3 "$GITHUB_WORKSPACE/scripts/generate-cask.py" \
            "$VERSION" "$ARM64_SHA" "$X64_SHA" > Casks/postly.rb

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/postly.rb
          git commit -m "chore: bump postly to ${VERSION}"
          git push
